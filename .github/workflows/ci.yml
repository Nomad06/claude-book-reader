name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Reader server (Node ${{ matrix.node }}, ${{ matrix.os }}${{ matrix.canvas && ', canvas' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        # These two also install the optional @napi-rs/canvas, so the figure
        # tests run; elsewhere they are skipped, as in a marketplace install.
        include:
          - os: ubuntu-latest
            node: 22
            canvas: true
          - os: macos-latest
            node: 22
            canvas: true
          # The floor in package.json engines and server/node-version.mjs.
          - os: ubuntu-latest
            node: '22.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.canvas
        run: npm ci
      - if: matrix.canvas
        name: Check that @napi-rs/canvas loads
        run: node -e "require('@napi-rs/canvas')"
      - run: node --test "test/*.test.mjs"

  mod:
    name: Mod (claude plugin validate + test, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # No type-check here: `npm run typecheck` needs the API types Claude Code
    # writes to .claude-plugin/types/ when a session loads the mod, and nothing
    # writes them without one (validate and test do not). Run it locally.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global @anthropic-ai/claude-code@latest
      - run: claude --version
      - run: claude plugin validate .
      - run: claude plugin test .
